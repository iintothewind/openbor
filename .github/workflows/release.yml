name: Release builds

# 发布一个 GitHub Release 时，自动构建并上传平台产物到该 Release：
#   linux-x64, linux-arm64, win-x32, psp, psv(vita), macos-arm64
# 注：win-x64 产物目前一直崩溃无法运行，暂从 release 关闭（见下方被注释的 win-x64 job）。
# 也可 workflow_dispatch 手动触发（仅产 artifacts，需配合一个 Release 才上传）。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # 上传 Release 资产

jobs:
  # ---------------------------------------------------------------------------
  # Linux x64：GitHub Actions 的 ubuntu-latest 原生就是 x86_64 Linux，直接在其上
  # 装依赖 + 原生编译，无需容器/QEMU（效率最高）。build-linux.sh 的 trap 会还原临时补丁。
  # ---------------------------------------------------------------------------
  linux-x64:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config yasm git \
            libsdl2-dev libsdl2-gfx-dev libpng-dev zlib1g-dev \
            libvorbis-dev libogg-dev libvpx-dev
      - name: Build Linux x64 (native)
        run: |
          bash scripts/build-linux.sh
          cp engine/OpenBOR "$RUNNER_TEMP/OpenBOR-linux-x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-linux-x86_64
          path: ${{ runner.temp }}/OpenBOR-linux-x86_64

  # ---------------------------------------------------------------------------
  # Windows x32 (i686, 32-bit)：用已发布的自建镜像 ghcr.io/iintothewind/openbor-build
  # （含 i686-w64-mingw32 交叉链 + win-sdk 第三方库）。独立 job，与 linux-x64 解耦。
  # ---------------------------------------------------------------------------
  win-x32:
    name: Windows x32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull build image
        run: |
          docker pull ghcr.io/iintothewind/openbor-build:6392
          docker tag  ghcr.io/iintothewind/openbor-build:6392 obor-build:6392
      - name: Build Windows x32 (i686, 32-bit)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/src -w /src obor-build:6392 \
            bash -c 'git config --global --add safe.directory /src && bash scripts/build-win-docker.sh'
          cp engine/OpenBOR.exe "$RUNNER_TEMP/OpenBOR-windows-x32.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-windows-x32
          path: ${{ runner.temp }}/OpenBOR-windows-x32.exe

  # ---------------------------------------------------------------------------
  # Linux arm64：GitHub Actions 原生 arm64 hosted runner（ubuntu-24.04-arm，已
  # GA、public 仓库免费）。runner 架构即 aarch64，与 linux-x64 同形态直接 apt
  # 装依赖 + 原生编译，无需容器/QEMU，也不依赖 ghcr arm64 镜像。
  # ---------------------------------------------------------------------------
  linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config yasm git \
            libsdl2-dev libsdl2-gfx-dev libpng-dev zlib1g-dev \
            libvorbis-dev libogg-dev libvpx-dev
      - name: Build Linux arm64 (native)
        run: |
          # gcc -dumpmachine = aarch64-linux-gnu，命中 engine/Makefile 的 aarch64
          # 分支（LIBRARIES=/usr/lib/aarch64-linux-gnu，关 -m64/-DAMD64/MMX）。
          TARGET_ARCH=arm64 bash scripts/build-linux.sh
          file engine/OpenBOR | grep -q "aarch64" \
            || { echo "!! 产物不是 ELF aarch64：$(file engine/OpenBOR)" >&2; exit 1; }
          cp engine/OpenBOR "$RUNNER_TEMP/OpenBOR-linux-aarch64"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-linux-aarch64
          path: ${{ runner.temp }}/OpenBOR-linux-aarch64

  # ---------------------------------------------------------------------------
  # Windows x64：暂关闭。win64 产物目前一直崩溃无法运行，先从 release 移除，
  # 待修复后再取消注释（连同下方 release job 的 needs / files 一并恢复）。
  # ---------------------------------------------------------------------------
  # win-x64:
  #   name: Windows x64
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Pull build image
  #       run: |
  #         docker pull ghcr.io/iintothewind/openbor-build-win64:6392
  #         docker tag  ghcr.io/iintothewind/openbor-build-win64:6392 obor-build-win64:6392
  #     - name: Build Windows x64 (cross)
  #       run: |
  #         docker run --rm -v "$GITHUB_WORKSPACE":/src -w /src obor-build-win64:6392 \
  #           bash -c 'git config --global --add safe.directory /src && bash scripts/build-win64-docker.sh'
  #         cp engine/OpenBOR.exe "$RUNNER_TEMP/OpenBOR-windows-x64.exe"
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         name: OpenBOR-windows-x64
  #         path: ${{ runner.temp }}/OpenBOR-windows-x64.exe

  # ---------------------------------------------------------------------------
  # PSP：官方 pspdev 镜像交叉 → EBOOT.PBP
  # ---------------------------------------------------------------------------
  psp:
    name: PSP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PSP
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/src -v "$RUNNER_TEMP":/out pspdev/pspdev:latest bash -c '
            set -e
            export PATH=/usr/local/pspdev/bin:$PATH
            export PSPSDK="$(psp-config --pspsdk-path)"
            cp -a /src /work && cd /work/engine
            find . -name "*.o" -delete
            make BUILD_PSP=1 PSPSDK="$PSPSDK"
            cp -f EBOOT.PBP /out/EBOOT.PBP
          '
          cp "$RUNNER_TEMP/EBOOT.PBP" "$RUNNER_TEMP/OpenBOR-psp-EBOOT.PBP"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-psp
          path: ${{ runner.temp }}/OpenBOR-psp-EBOOT.PBP

  # ---------------------------------------------------------------------------
  # Vita(PSV)：官方 vitasdk 镜像交叉 → OpenBOR.vpk
  # ---------------------------------------------------------------------------
  vita:
    name: PSV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Vita
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/src -v "$RUNNER_TEMP":/out vitasdk/vitasdk:latest bash -c '
            set -e
            export PATH=/usr/local/vitasdk/bin:$PATH
            cp -a /src /work && cd /work/engine
            find . -name "*.o" -delete
            make BUILD_VITA=1
            cp -f OpenBOR.vpk /out/OpenBOR.vpk
          '
          cp "$RUNNER_TEMP/OpenBOR.vpk" "$RUNNER_TEMP/OpenBOR-psv.vpk"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-psv
          path: ${{ runner.temp }}/OpenBOR-psv.vpk

  # ---------------------------------------------------------------------------
  # macOS arm64：无法交叉/Docker，需真实 Apple Silicon runner（macos-14）。
  # build-mac.sh 用 Homebrew 依赖在仓库外 temp 编出 .app 并 adhoc 签名。
  # ---------------------------------------------------------------------------
  macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app
        run: |
          bash scripts/build-mac.sh "$RUNNER_TEMP/macout"
          ditto -c -k --sequesterRsrc "$RUNNER_TEMP/macout/OpenBOR.app" \
            "$RUNNER_TEMP/OpenBOR-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-macos-arm64
          path: ${{ runner.temp }}/OpenBOR-macos-arm64.zip

  # ---------------------------------------------------------------------------
  # Android arm64-v8a：自建镜像 ghcr.io/iintothewind/openbor-android:6394（内置 JDK/SDK/NDK/
  # Gradle + 五库源码，含 tremor，CI 可完全离线 seed，不依赖 IPv6-only 的 git.xiph.org）。
  # 容器内端到端 01→04 编 arm64-v8a debug APK。工作卷用容器内 Linux fs（OBOR_WORK=/work），
  # 规避任何宿主 bind mount 丢失执行位的问题；产物 APK 拷到 $RUNNER_TEMP 供上传。
  # ---------------------------------------------------------------------------
  android:
    name: Android arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull android build image
        run: |
          docker pull ghcr.io/iintothewind/openbor-android:6394
          docker tag ghcr.io/iintothewind/openbor-android:6394 obor-android:6394
      - name: Build Android APK
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/src \
            -v "$RUNNER_TEMP":/out \
            -e OBOR_WORK=/work \
            -e ANDROID_HOME=/opt/android-sdk \
            -w /src \
            obor-android:6394 bash -c '
              set -e
              mkdir -p /work   # OBOR_WORK=/work 未 bind mount，落在容器可写层(ext4/overlayfs 保留执行位)，job 结束自动清理
              # seed: 镜像内置五库 -> 容器内工作卷（01-clone 检测到 .git 即跳过联网）
              DEPS=/opt/openbor-deps
              for d in sdl2 ogg libpng tremor libvpx; do
                [ -d "/work/$d/.git" ] || cp -a "$DEPS/$d" "/work/$d"
              done
              bash scripts/android/01-clone.sh
              bash scripts/android/02-build-deps.sh
              bash scripts/android/03-build-native.sh
              bash scripts/android/04-build-apk.sh
              APK=/work/apk/app/build/outputs/apk/debug/app-debug.apk
              [ -f "$APK" ] || { echo "X APK 未找到"; exit 1; }
              cp "$APK" /out/OpenBOR-android-arm64-v8a.apk
            '
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-android-arm64-v8a
          path: ${{ runner.temp }}/OpenBOR-android-arm64-v8a.apk

  # ---------------------------------------------------------------------------
  # 汇总：等全部平台产物就绪，下载合并，附 SHA256SUMS，上传到刚发布的 Release。
  # ---------------------------------------------------------------------------
  release:
    name: Publish to Release
    runs-on: ubuntu-latest
    needs: [linux-x64, win-x32, linux-arm64, android, psp, vita, macos-arm64]
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Flatten + checksums
        run: |
          mkdir -p out
          # 各 job 的产物在 dist/<artifact-name>/<file>；merge-multiple 后落到 dist/<file>
          find dist -maxdepth 2 -type f \( -name 'OpenBOR-*' -o -name 'EBOOT.PBP' \) -exec cp {} out/ \;
          ( cd out && sha256sum OpenBOR-* > SHA256SUMS.txt )
          ls -la out
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/OpenBOR-linux-x86_64
            out/OpenBOR-linux-aarch64
            out/OpenBOR-windows-x32.exe
            out/OpenBOR-android-arm64-v8a.apk
            out/OpenBOR-psp-EBOOT.PBP
            out/OpenBOR-psv.vpk
            out/OpenBOR-macos-arm64.zip
            out/SHA256SUMS.txt
          fail_on_unmatched_files: true
